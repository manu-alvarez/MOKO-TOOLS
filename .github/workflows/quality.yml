name: MOKO Tools Next.js acceptance

on:
  push:
    branches: [ci/verify-moko-20261123]
    paths:
      - .github/workflows/quality.yml
      - moko_tooling_utils/nextjs_space/package.json
      - moko_tooling_utils/nextjs_space/next.config.js
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: moko_tooling_utils/nextjs_space
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/verify-moko-20261123
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock declared dependencies
        run: npm install --package-lock-only
      - name: Reinstall from lock
        run: npm ci
      - name: Compile Next.js production
        run: npm run build
      - name: Commit verified dependency lock
        working-directory: .
        run: |
          set -euo pipefail
          git add moko_tooling_utils/nextjs_space/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: lock MOKO Tools frontend dependencies'
          git push origin HEAD:ci/verify-moko-20261123
